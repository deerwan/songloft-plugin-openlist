<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OpenList 音乐源</title>
    <!-- CSS 变量(--md-*)、字体、reset 由主程序 common.css 注入,插件样式只消费变量 -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <!-- AppBar -->
    <header class="app-bar">
        <span class="material-symbols-outlined">cloud_sync</span>
        <h1>OpenList 音乐源</h1>
        <button class="btn-icon" id="refreshBtn" title="刷新">
            <span class="material-symbols-outlined">refresh</span>
        </button>
    </header>

    <!-- 服务器管理 -->
    <div class="tab-content" id="tab-servers">
        <div class="container">
            <!-- 浏览服务器选择 -->
            <div class="card">
                <div class="card-header">
                    <span class="material-symbols-outlined">folder_open</span>
                    浏览服务器
                </div>
                <div class="card-body">
                    <select id="browseServerSelect" class="text-field" aria-label="选择要浏览的服务器">
                        <option value="">请选择服务器...</option>
                    </select>
                    <div class="form-label" style="margin-top:8px;margin-bottom:0">选择后自动进入「文件浏览」页</div>
                </div>
            </div>

            <!-- 添加服务器卡片 -->
            <div class="card">
                <div class="card-header">
                    <span class="material-symbols-outlined">add_link</span>
                    添加 OpenList / AList 服务器
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">配置名称</label>
                        <input type="text" class="text-field" id="serverName" placeholder="例如:我的网盘聚合">
                    </div>
                    <div class="form-group" style="margin-top:12px">
                        <label class="form-label">服务器地址</label>
                        <input type="text" class="text-field" id="serverUrl" placeholder="例如:http://192.168.1.10:5244">
                    </div>
                    <div class="form-group" style="margin-top:12px">
                        <label class="form-label">用户名(服务端启用游客访问时可留空)</label>
                        <input type="text" class="text-field" id="serverUsername" placeholder="OpenList 登录用户名">
                    </div>
                    <div class="form-group" style="margin-top:12px">
                        <label class="form-label">密码</label>
                        <input type="password" class="text-field" id="serverPassword" placeholder="OpenList 登录密码">
                    </div>
                    <div class="toolbar" style="padding:16px 0 0;justify-content:flex-end;gap:12px;display:flex;">
                        <button class="btn-outlined" id="testServerBtn">
                            <span class="material-symbols-outlined">wifi_tethering</span>
                            测试连接
                        </button>
                        <button class="btn-filled" id="addServerBtn">
                            <span class="material-symbols-outlined">save</span>
                            保存服务器
                        </button>
                    </div>
                </div>
            </div>

            <!-- 已配置的服务器 -->
            <div class="card">
                <div class="card-header">
                    <span class="material-symbols-outlined">dns</span>
                    已配置的服务器
                </div>
                <div class="card-body" id="serverList">
                    <div class="empty-state">暂无服务器,请先添加</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件浏览(默认首屏) -->
    <div class="tab-content active" id="tab-browser">
        <div class="container">
            <!-- 路径工具栏:独立吸顶条,与文件列表卡片分离(服务器在「服务器管理」页选择) -->
            <div class="browser-toolbar">
                <button class="btn-icon" id="browserUpBtn" title="返回上一级">
                    <span class="material-symbols-outlined">arrow_upward</span>
                </button>
                <div id="browserPathDisplay">/</div>
                <button class="btn-icon" id="viewToggleBtn" title="切换视图">
                    <span class="material-symbols-outlined">grid_view</span>
                </button>
                <button class="btn-text" id="toggleSelectModeBtn" style="display:none;">
                    <span class="material-symbols-outlined">checklist</span> 多选
                </button>
            </div>

            <!-- 文件列表 -->
            <div class="card">
                <div class="card-body" id="browserList" style="padding-top:0">
                    <div class="empty-state">请选择服务器进行浏览</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 迷你播放器(点击文件直接播放时出现,悬浮在 Tab Bar 上方) -->
    <div id="miniPlayer" class="mini-player">
        <div class="mini-player-progress">
            <input type="range" id="playerProgress" min="0" max="1000" value="0" aria-label="播放进度">
        </div>
        <div class="mini-player-body">
            <div class="mini-player-info">
                <div class="mini-player-title" id="playerTitle">未在播放</div>
                <div class="mini-player-sub" id="playerSub"></div>
            </div>
            <span class="mini-player-time" id="playerTime"></span>
            <button class="btn-icon" id="playerPrevBtn" title="上一首">
                <span class="material-symbols-outlined">skip_previous</span>
            </button>
            <button class="btn-icon" id="playerPlayBtn" title="播放">
                <span class="material-symbols-outlined">play_arrow</span>
            </button>
            <button class="btn-icon" id="playerNextBtn" title="下一首">
                <span class="material-symbols-outlined">skip_next</span>
            </button>
            <button class="btn-icon" id="playerCloseBtn" title="关闭播放器">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <nav class="tab-bar" role="tablist">
        <button class="tab-item active" data-tab="browser" role="tab">
            <span class="material-symbols-outlined">folder</span>
            <span>文件浏览</span>
        </button>
        <button class="tab-item" data-tab="servers" role="tab">
            <span class="material-symbols-outlined">dns</span>
            <span>服务器管理</span>
        </button>
    </nav>

    <!-- FAB (多选操作栏) -->
    <div id="fabContainer" class="fab-container">
        <div style="display:flex;align-items:center;gap:12px;width:100%;">
            <span id="fabSelectionCount" style="font-weight:500;font-size:14px;flex:1;">已选 0 项</span>
            <button class="btn-text" id="fabSelectAllBtn" style="color:var(--md-on-surface)">
                <span class="material-symbols-outlined" style="font-size:18px;">select_all</span> 全选本页
            </button>
            <button class="btn-text" id="fabCancelBtn" style="color:var(--md-on-surface)">取消</button>
            <button class="btn-filled" id="fabImportBtn">
                <span class="material-symbols-outlined" style="font-size:18px;">cloud_download</span> 直接入库
            </button>
            <button class="btn-filled" id="fabPlaylistBtn" style="background:var(--md-secondary);color:var(--md-on-secondary)">
                <span class="material-symbols-outlined" style="font-size:18px;">playlist_add</span> 建歌单
            </button>
        </div>
    </div>

    <!-- Snackbar -->
    <div id="snackbar" class="snackbar"></div>

    <!-- Progress Dialog -->
    <div id="progressDialog" class="dialog-overlay" role="dialog" aria-modal="true">
        <div class="dialog" style="max-width: 320px;text-align:center;">
            <div class="dialog-title" id="progressTitle">正在处理</div>
            <div class="dialog-content" style="padding:24px 0;">
                <div class="spinner"></div>
                <div id="progressText" style="margin-top:16px;color:var(--md-on-surface-variant);font-size:14px;">请稍候...</div>
            </div>
        </div>
    </div>

    <!-- Playlist Import Dialog -->
    <div id="playlistDialog" class="dialog-overlay" role="dialog" aria-modal="true">
        <div class="dialog" style="max-width: 320px;">
            <div class="dialog-title">导入到歌单</div>
            <div class="dialog-content">
                <div class="form-group">
                    <label class="form-label" for="playlistTarget">目标歌单</label>
                    <select class="text-field" id="playlistTarget" aria-label="目标歌单" disabled>
                        <option value="__new__">新建歌单</option>
                    </select>
                </div>
                <div class="form-group" id="playlistNameGroup">
                    <label class="form-label" for="playlistName">歌单名称</label>
                    <input type="text" class="text-field" id="playlistName" placeholder="例如:OpenList 精选" aria-label="歌单名称">
                </div>
            </div>
            <div class="dialog-actions">
                <button class="btn-text" id="cancelPlaylistBtn">取消</button>
                <button class="btn-filled" id="confirmPlaylistBtn">确认</button>
            </div>
        </div>
    </div>

    <!-- 入口脚本:builder 会以此打包 modules/ 下全部模块为 app.bundle.js -->
    <script type="module" src="static/js/app.js"></script>
</body>
</html>
